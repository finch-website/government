<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Сайт | Тесты</title>
    <style>
        /* --- Сброс и базовые стили --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f1115;
            background-image: radial-gradient(#2a2d35 1px, transparent 1px);
            background-size: 20px 20px;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- Шапка сайта --- */
        header {
            background-color: rgba(22, 24, 29, 0.8);
            border-bottom: 1px solid #2a2d35;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #ffffff;
        }

        nav a {
            color: #a0a5b1;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #ffffff;
        }

        /* --- Основной контент --- */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .card {
            background-color: #16181d;
            border: 1px solid #2a2d35;
            border-radius: 8px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .card h1 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .card p {
            color: #a0a5b1;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .divider {
            height: 1px;
            background-color: #2a2d35;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px;
            background-color: #ffffff;
            color: #000000;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
            font-size: 15px;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #e0e0e0;
        }

        /* --- Подвал --- */
        footer {
            text-align: center;
            padding: 20px;
            font-family: monospace;
            font-size: 11px;
            color: #5c6270;
            border-top: 1px solid #2a2d35;
        }

        footer p {
            margin-bottom: 5px;
        }

        /* --- Адаптивность --- */
        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 15px;
            }
            nav a {
                margin: 0 10px;
            }
        }
    </style>
</head>
<body>

    <!-- Шапка сайта -->
    <header>
        <div class="logo">
            <div class="logo-icon"></div>
            EMS Rockford
        </div>
        <nav>
            <a href="#">Главная</a>
            <a href="#">Тесты</a>
            <a href="#">Контакты</a>
        </nav>
    </header>

    <!-- Основной блок -->
    <main>
        <div class="card">
            <h1>Тесты | EMS - Rockford</h1>
            <p>Авторизуйтесь, чтобы проходить тесты</p>
            <div class="divider"></div>
            <button class="btn" onclick="showAlert()">Авторизоваться через Google</button>
        </div>
    </main>

    <!-- Подвал -->
    <footer>
        <p>ДОСТУП ТОЛЬКО ДЛЯ АВТОРИЗОВАННЫХ ПОЛЬЗОВАТЕЛЕЙ</p>
        <p>ВСЕ ВАШИ ДАННЫЕ ХРАНЯТСЯ НА СТОРОНЕ GOOGLE СЕРВЕРОВ</p>
        <p style="margin-top: 10px;">EMS ROCKFORD | LEGION TESTS</p>
    </footer>

    <script>
        // Простая логика взаимодействия
        function showAlert() {
            alert('Это демонстрационная кнопка.\n\nВ реальном проекте здесь будет перенаправление на страницу авторизации Google или другого сервиса.');
        }
    </script>

</body>
</html>
